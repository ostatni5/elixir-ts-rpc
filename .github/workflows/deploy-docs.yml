name: Deploy docs

# Builds the VitePress site in docs/ and publishes it to GitHub Pages.
# Runs on pushes to main (released docs) and can be triggered manually for any
# branch. One-time setup: Settings → Pages → Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      # Canonical text for the shared guide pages lives in the hex package and
      # is pulled in via VitePress <!--@include:-->, so it must trigger a rebuild.
      - "apps/rpc_elixir/docs/**"
      # Twoslash type-checks the doc snippets against these packages' types, so a
      # change to either can change (or break) the published output.
      - "packages/client/**"
      - "packages/react/**"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # lastUpdated reads git history

      # Node version pinned to match .tool-versions: nodejs 22.0.0.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.0.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Twoslash type-checks the docs snippets against @elixir-ts-rpc/client and
      # @elixir-ts-rpc/react, which resolve through their gitignored dist/. Without
      # this the docs build fails on unresolved imports.
      - name: Build workspace packages
        run: |
          npm run build --workspace @elixir-ts-rpc/client
          npm run build --workspace @elixir-ts-rpc/react

      # Fails on any snippet that no longer type-checks, and (via the chained
      # check-no-local-paths script) on any local path in the built output.
      - name: Build with VitePress
        run: npm run docs:build --workspace @elixir-ts-rpc/docs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
